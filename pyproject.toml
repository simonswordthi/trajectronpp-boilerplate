[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pie-trajectronpp"
version = "0.1.0"
description = "PIE to Trajectron++-style pedestrian-only boilerplate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pie-reader = "pie_reader:main"
track-extractor = "track_extractor:main"
build-features = "trajectory_features:main"
build-scenes = "scene_builder:main"
split-dataset = "dataset_splitter:main"
train-baseline = "train_baseline:main"
evaluate-baseline = "evaluate_baseline:main"
visualize-tracks = "visualize_tracks:main"
